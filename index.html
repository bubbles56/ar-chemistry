<!DOCTYPE html>
<!-- ============================================================================
     ИНТЕРАКТИВНЫЙ AR-УЧЕБНИК ХИМИИ — 5 ЛАБОРАТОРИЙ ДОПОЛНЕННОЙ РЕАЛЬНОСТИ
     ----------------------------------------------------------------------------
     Метки:   hiro (инфо-панель) + 5 собственных паттерн-маркеров (m1..m5)
     Жесты:   1 палец — вращение сцены | щипок / колесо — масштаб |
              двойной тап / двойной клик — запуск химического процесса
     Стек:    HTML5 + A-Frame 1.2.0 + AR.js 3.4.5 (CDN)
     Особенность: русский язык в 3D — собственный компонент ru-text,
     который рисует текст на canvas и накладывает его текстурой на плоскость
     (штатные SDF-шрифты A-Frame кириллицу не содержат)
     ============================================================================ -->
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR-лаборатории химии</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    /* touch-action: none — ключевой фикс для iOS Safari: без него Safari
       перехватывает касания (умный зум двойного тапа, скролл, pinch страницы)
       и уводит их в touchcancel, до наших обработчиков события не доходят */
    html, body { margin: 0; padding: 0; overflow: hidden; touch-action: none; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    #ui-panel {
      position: fixed; top: 10px; left: 10px; right: 10px; z-index: 10;
      background: rgba(10, 15, 35, 0.72);
      border: 1px solid rgba(120, 200, 255, 0.5);
      border-radius: 14px; color: #eaf6ff; padding: 10px 14px;
      backdrop-filter: blur(6px);
    }
    #lab-title { font-size: 15px; margin: 0 0 4px 0; color: #7df9ff; letter-spacing: 0.5px; }
    #status    { font-size: 13px; margin: 2px 0; color: #ffd166; }
    #equation  { font-size: 17px; font-weight: bold; margin: 4px 0; color: #ffffff; }
    #lab-hint  { font-size: 12px; margin: 2px 0 0 0; opacity: 0.85; }
  </style>
</head>

<body>

  <!-- ==== HTML-ПАНЕЛЬ (русские подписи и уравнения поверх сцены) ==== -->
  <div id="ui-panel">
    <p id="lab-title">⚗️ AR-лаборатории химии</p>
    <p id="status">🔍 Наведите камеру на метку…</p>
    <p id="equation">—</p>
    <p id="lab-hint">Метки 1–5 запускают лабораторные работы</p>
  </div>

  <a-scene embedded
           arjs="sourceType: webcam; debugUIEnabled: false;"
           renderer="antialias: true; logarithmicDepthBuffer: true;"
           vr-mode-ui="enabled: false">

    <!-- Освещение: рассеянный свет + два направленных для объёма и бликов -->
    <a-light type="ambient" color="#ffffff" intensity="0.85"></a-light>
    <a-light type="directional" color="#dff3ff" intensity="1.4" position="2 4 3"></a-light>
    <a-light type="directional" color="#7df9ff" intensity="0.5" position="-2 1 -3"></a-light>

    <!-- ==================================================================
         МЕТКА 0 'hiro' — ИНФО-ПАНЕЛЬ: перечень лабораторий на русском
         ================================================================== -->
    <a-marker preset="hiro" id="marker-info">
      <a-entity class="lab-scene" position="0 0 0">
        <a-entity class="lab-title" ru-text="value: AR-ЛАБОРАТОРИИ ХИМИИ; color: #7df9ff; height: 0.3" position="0 2.6 0">
          <a-animation attribute="position" dur="3000" direction="alternate" repeat="indefinite" from="0 2.6 0" to="0 2.72 0"></a-animation>
        </a-entity>
        <a-entity ru-text="value: 1 · МОЛЕКУЛА ВОДЫ H₂O; color: #ffffff; height: 0.22" position="0 2.05 0"></a-entity>
        <a-entity ru-text="value: 2 · ЭЛЕКТРОЛИЗ; color: #ffffff; height: 0.22" position="0 1.7 0"></a-entity>
        <a-entity ru-text="value: 3 · СИНТЕЗ ГАЗОВ; color: #ffffff; height: 0.22" position="0 1.35 0"></a-entity>
        <a-entity ru-text="value: 4 · МОДЕЛЬ АТОМА; color: #ffffff; height: 0.22" position="0 1.0 0"></a-entity>
        <a-entity ru-text="value: 5 · РЕШЁТКА NaCl; color: #ffffff; height: 0.22" position="0 0.65 0"></a-entity>
        <a-torus position="0 0.3 0" radius="0.35" radius-tubular="0.02" rotation="90 0 0"
                 material="color: #7df9ff; metalness: 0.7; roughness: 0.2; emissive: #114455; emissiveIntensity: 0.8;">
          <a-animation attribute="rotation" dur="6000" repeat="indefinite" from="90 0 0" to="90 360 0"></a-animation>
        </a-torus>
      </a-entity>
    </a-marker>

    <!-- ==================================================================
         МЕТКА 1 (m1) — ЛАБ. «МОЛЕКУЛА ВОДЫ»: жесты + двойной тап = электролиз
         ================================================================== -->
    <a-marker type="pattern" url="markers/m1.patt" id="marker-m1">
      <a-entity class="lab-scene" position="0 0 0" gesture-controls
                lab="title3dRun: 2H₂O → 2H₂↑ + O₂↑; title3dReset: ЭЛЕКТРОЛИЗ ВОДЫ: H₂O;
                     eqRun: 2H₂O → 2H₂↑ + O₂↑ ⚡ электролиз идёт!;
                     eqReset: H₂O — молекула стабильна ⚪; sound: true">

        <a-entity class="lab-title" ru-text="value: ЭЛЕКТРОЛИЗ ВОДЫ: H₂O; color: #7df9ff; height: 0.28" position="0 2.45 0">
          <a-animation attribute="position" dur="3000" direction="alternate" repeat="indefinite" from="0 2.45 0" to="0 2.57 0"></a-animation>
        </a-entity>

        <!-- Молекула H₂O: угол H–O–H ≈ 104,5°, как в реальности -->
        <a-entity id="molecule" position="0 1.0 0">
          <a-animation attribute="rotation" dur="10000" repeat="indefinite" from="0 0 0" to="0 360 0"></a-animation>

          <a-sphere class="anim-target" radius="0.30" position="0 0 0"
                    material="color: #ff3b30; metalness: 0.5; roughness: 0.25; emissive: #550000; emissiveIntensity: 0.6;"
                    animation__run="property: material.color; to: #ff9500; dur: 900; startEvents: run"
                    animation__reset="property: material.color; to: #ff3b30; dur: 600; startEvents: reset">
          </a-sphere>

          <a-sphere class="anim-target" radius="0.17" position="-0.55 -0.55 0"
                    material="color: #bfe6ff; metalness: 0.4; roughness: 0.3; emissive: #0a2a44; emissiveIntensity: 0.5;"
                    animation__run="property: position; to: -1.9 -0.2 0.4; dur: 1400; easing: easeOutQuad; startEvents: run"
                    animation__reset="property: position; to: -0.55 -0.55 0; dur: 1000; startEvents: reset"
                    animation__runc="property: material.color; to: #00ffcc; dur: 900; startEvents: run"
                    animation__resetc="property: material.color; to: #bfe6ff; dur: 600; startEvents: reset">
          </a-sphere>

          <a-sphere class="anim-target" radius="0.17" position="0.55 -0.55 0"
                    material="color: #bfe6ff; metalness: 0.4; roughness: 0.3; emissive: #0a2a44; emissiveIntensity: 0.5;"
                    animation__run="property: position; to: 1.9 -0.2 0.4; dur: 1400; easing: easeOutQuad; startEvents: run"
                    animation__reset="property: position; to: 0.55 -0.55 0; dur: 1000; startEvents: reset"
                    animation__runc="property: material.color; to: #00ffcc; dur: 900; startEvents: run"
                    animation__resetc="property: material.color; to: #bfe6ff; dur: 600; startEvents: reset">
          </a-sphere>

          <a-cylinder class="anim-target" radius="0.045" height="0.75" position="-0.275 -0.275 0" rotation="0 0 -45"
                      material="color: #7df9ff; metalness: 0.7; roughness: 0.2; emissive: #114455; emissiveIntensity: 0.9;"
                      animation__run="property: scale; to: 0.01 0.01 0.01; dur: 800; startEvents: run"
                      animation__reset="property: scale; to: 1 1 1; dur: 800; startEvents: reset">
          </a-cylinder>
          <a-cylinder class="anim-target" radius="0.045" height="0.75" position="0.275 -0.275 0" rotation="0 0 45"
                      material="color: #7df9ff; metalness: 0.7; roughness: 0.2; emissive: #114455; emissiveIntensity: 0.9;"
                      animation__run="property: scale; to: 0.01 0.01 0.01; dur: 800; startEvents: run"
                      animation__reset="property: scale; to: 1 1 1; dur: 800; startEvents: reset">
          </a-cylinder>
        </a-entity>

        <a-sphere class="anim-target" radius="1.4" position="0 1.0 0"
                  material="color: #ffffff; opacity: 0; transparent: true; side: double;"
                  animation__run="property: material.opacity; from: 0.95; to: 0; dur: 700; startEvents: run">
        </a-sphere>
      </a-entity>
    </a-marker>

    <!-- ==================================================================
         МЕТКА 2 (m2) — ЛАБ. «ЭЛЕКТРОЛИЗ»: ванночка с электродами,
         двойной тап пускает ток
         ================================================================== -->
    <a-marker type="pattern" url="markers/m2.patt" id="marker-m2">
      <a-entity class="lab-scene" position="0 0 0" gesture-controls
                lab="title3dRun: ТОК ПОШЁЛ!; title3dReset: ЭЛЕКТРОЛИТИЧЕСКАЯ ВАННА;
                     eqRun: Катод (−): H₂↑ | Анод (+): O₂↑;
                     eqReset: Готова к пуску тока ⚡; sound: true">

        <a-entity class="lab-title" ru-text="value: ЭЛЕКТРОЛИЗЕНАЯ ВАННОЧКА; color: #7df9ff; height: 0.26" position="0 2.85 0">
          <a-animation attribute="position" dur="3000" direction="alternate" repeat="indefinite" from="0 2.85 0" to="0 2.97 0"></a-animation>
        </a-entity>

        <a-entity position="0 0.85 0">
          <a-cylinder radius="0.62" height="1.0" position="0 0 0"
                      material="color: #cfefff; opacity: 0.18; transparent: true; metalness: 0.1; roughness: 0.05; side: double;">
          </a-cylinder>
          <a-cylinder radius="0.56" height="0.8" position="0 -0.05 0"
                      material="color: #4db8ff; opacity: 0.55; transparent: true; metalness: 0.2; roughness: 0.3;">
          </a-cylinder>

          <a-box class="anim-target" width="0.07" height="1.25" depth="0.07" position="-0.28 0.25 0"
                 material="color: #c0c8d0; metalness: 0.9; roughness: 0.2;"
                 animation__run="property: material.emissive; to: #00ffcc; dur: 500; startEvents: run"
                 animation__runi="property: material.emissiveIntensity; to: 1.2; dur: 500; startEvents: run"
                 animation__reset="property: material.emissive; to: #000000; dur: 500; startEvents: reset">
          </a-box>
          <a-box class="anim-target" width="0.07" height="1.25" depth="0.07" position="0.28 0.25 0"
                 material="color: #c0c8d0; metalness: 0.9; roughness: 0.2;"
                 animation__run="property: material.emissive; to: #ff6a00; dur: 500; startEvents: run"
                 animation__runi="property: material.emissiveIntensity; to: 1.2; dur: 500; startEvents: run"
                 animation__reset="property: material.emissive; to: #000000; dur: 500; startEvents: reset">
          </a-box>

          <a-cylinder radius="0.02" height="1.3" position="-0.28 1.5 0" material="color: #222222; metalness: 0.6; roughness: 0.4;"></a-cylinder>
          <a-cylinder radius="0.02" height="1.3" position="0.28 1.5 0" material="color: #222222; metalness: 0.6; roughness: 0.4;"></a-cylinder>
          <a-box width="0.75" height="0.32" depth="0.3" position="0 2.2 0" material="color: #30364a; metalness: 0.5; roughness: 0.4;"></a-box>
          <a-entity ru-text="value: +; color: #ff9a3d; height: 0.22" position="0.24 2.2 0.17"></a-entity>
          <a-entity ru-text="value: −; color: #7df9ff; height: 0.22" position="-0.24 2.2 0.17"></a-entity>

          <!-- Пузырьки «в покое» -->
          <a-entity id="bubbles-idle">
            <a-sphere radius="0.035" position="-0.2 -0.35 0.1" material="color: #eaf6ff; opacity: 0.7; transparent: true;">
              <a-animation attribute="position" dur="4000" repeat="indefinite" from="-0.2 -0.35 0.1" to="-0.2 0.3 0.1"></a-animation>
            </a-sphere>
            <a-sphere radius="0.025" position="0.15 -0.3 -0.15" material="color: #eaf6ff; opacity: 0.7; transparent: true;">
              <a-animation attribute="position" dur="5000" repeat="indefinite" from="0.15 -0.3 -0.15" to="0.15 0.3 -0.15"></a-animation>
            </a-sphere>
          </a-entity>

          <!-- Пузырьки «под током» -->
          <a-entity id="bubbles-fast" visible="false">
            <a-sphere radius="0.04" position="-0.28 -0.35 0" material="color: #00ffcc; opacity: 0.85; transparent: true; emissive: #004433;">
              <a-animation attribute="position" dur="1400" repeat="indefinite" from="-0.28 -0.35 0" to="-0.28 0.32 0"></a-animation>
            </a-sphere>
            <a-sphere radius="0.03" position="-0.24 -0.35 0.08" material="color: #00ffcc; opacity: 0.85; transparent: true;">
              <a-animation attribute="position" dur="1100" repeat="indefinite" from="-0.24 -0.35 0.08" to="-0.24 0.32 0.08"></a-animation>
            </a-sphere>
            <a-sphere radius="0.035" position="0.28 -0.35 0" material="color: #ffaa55; opacity: 0.85; transparent: true;">
              <a-animation attribute="position" dur="1700" repeat="indefinite" from="0.28 -0.35 0" to="0.28 0.32 0"></a-animation>
            </a-sphere>
            <a-sphere radius="0.025" position="0.24 -0.35 -0.08" material="color: #ffaa55; opacity: 0.85; transparent: true;">
              <a-animation attribute="position" dur="1300" repeat="indefinite" from="0.24 -0.35 -0.08" to="0.24 0.32 -0.08"></a-animation>
            </a-sphere>
          </a-entity>

          <!-- Подписи электродов (появляются при пуске тока) -->
          <a-entity class="anim-target" ru-text="value: КАТОД (−): H₂; color: #00ffcc; height: 0.2" position="-1.4 -100 0"
                    animation__run="property: position; to: -1.4 0.55 0; dur: 800; startEvents: run"
                    animation__reset="property: position; to: -1.4 -100 0; dur: 10; startEvents: reset">
          </a-entity>
          <a-entity class="anim-target" ru-text="value: АНОД (+): O₂; color: #ff9a3d; height: 0.2" position="1.4 -100 0"
                    animation__run="property: position; to: 1.4 0.55 0; dur: 800; startEvents: run"
                    animation__reset="property: position; to: 1.4 -100 0; dur: 10; startEvents: reset">
          </a-entity>

          <!-- Уравнение над ванночкой (появляется при пуске) -->
          <a-entity class="anim-target" ru-text="value: 2H₂O → 2H₂↑ + O₂↑; color: #ffffff; height: 0.24" position="0 -100 0"
                    animation__run="property: position; to: 0 3.3 0; dur: 800; startEvents: run"
                    animation__reset="property: position; to: 0 -100 0; dur: 10; startEvents: reset">
          </a-entity>
        </a-entity>
      </a-entity>
    </a-marker>

    <!-- ==================================================================
         МЕТКА 3 (m3) — ЛАБ. «СИНТЕЗ ГАЗОВ»: H₂ + O₂ → капля воды + энергия
         ================================================================== -->
    <a-marker type="pattern" url="markers/m3.patt" id="marker-m3">
      <a-entity class="lab-scene" position="0 0 0" gesture-controls
                lab="title3dRun: 2H₂ + O₂ → 2H₂O + ЭНЕРГИЯ; title3dReset: СИНТЕЗ ГАЗОВ: H₂ + O₂;
                     eqRun: 2H₂ + O₂ → 2H₂O + энергия 🔥;
                     eqReset: Смесь газов готова ⚗️; sound: true">

        <a-entity class="lab-title" ru-text="value: СИНТЕЗ ГАЗОВ: H₂ + O₂; color: #7df9ff; height: 0.26" position="0 2.6 0">
          <a-animation attribute="position" dur="3000" direction="alternate" repeat="indefinite" from="0 2.6 0" to="0 2.72 0"></a-animation>
        </a-entity>

        <!-- Два шарика водорода слева -->
        <a-sphere class="anim-target" radius="0.22" position="-1.0 1.25 0"
                  material="color: #66ccff; metalness: 0.3; roughness: 0.35; emissive: #0a2a44; emissiveIntensity: 0.5;"
                  animation__run="property: position; to: -0.22 1.25 0; dur: 900; easing: easeInOutQuad; startEvents: run"
                  animation__reset="property: position; to: -1.0 1.25 0; dur: 900; startEvents: reset"
                  animation__hide="property: scale; to: 0.01 0.01 0.01; dur: 150; delay: 950; startEvents: run"
                  animation__show="property: scale; to: 1 1 1; dur: 150; delay: 950; startEvents: reset">
          <a-entity ru-text="value: H₂; color: #ffffff; height: 0.18" position="0 0.38 0"></a-entity>
        </a-sphere>
        <a-sphere class="anim-target" radius="0.22" position="-1.0 0.55 0"
                  material="color: #66ccff; metalness: 0.3; roughness: 0.35; emissive: #0a2a44; emissiveIntensity: 0.5;"
                  animation__run="property: position; to: -0.22 0.55 0; dur: 900; easing: easeInOutQuad; startEvents: run"
                  animation__reset="property: position; to: -1.0 0.55 0; dur: 900; startEvents: reset"
                  animation__hide="property: scale; to: 0.01 0.01 0.01; dur: 150; delay: 950; startEvents: run"
                  animation__show="property: scale; to: 1 1 1; dur: 150; delay: 950; startEvents: reset">
        </a-sphere>

        <!-- Шарик кислорода справа -->
        <a-sphere class="anim-target" radius="0.30" position="1.0 0.9 0"
                  material="color: #ff5544; metalness: 0.4; roughness: 0.3; emissive: #441111; emissiveIntensity: 0.5;"
                  animation__run="property: position; to: 0.28 0.9 0; dur: 900; easing: easeInOutQuad; startEvents: run"
                  animation__reset="property: position; to: 1.0 0.9 0; dur: 900; startEvents: reset"
                  animation__hide="property: scale; to: 0.01 0.01 0.01; dur: 150; delay: 950; startEvents: run"
                  animation__show="property: scale; to: 1 1 1; dur: 150; delay: 950; startEvents: reset">
          <a-entity ru-text="value: O₂; color: #ffffff; height: 0.18" position="0 0.48 0"></a-entity>
        </a-sphere>

        <a-sphere class="anim-target" radius="0.9" position="0 0.9 0"
                  material="color: #ffffff; opacity: 0; transparent: true; side: double;"
                  animation__run="property: material.opacity; from: 0.95; to: 0; dur: 600; delay: 900; startEvents: run">
        </a-sphere>

        <!-- Капля воды — результат синтеза -->
        <a-sphere class="anim-target" radius="0.34" position="0 0.9 0" scale="0.01 0.01 0.01"
                  material="color: #2e9bff; metalness: 0.4; roughness: 0.15; emissive: #062a44; emissiveIntensity: 0.6;"
                  animation__run="property: scale; to: 1 1 1; dur: 700; delay: 1100; easing: easeOutBack; startEvents: run"
                  animation__reset="property: scale; to: 0.01 0.01 0.01; dur: 300; startEvents: reset"
                  animation__bob="property: position; dur: 2500" direction="alternate" repeat="indefinite" from="0 0.9 0" to="0 1.0 0">
        </a-sphere>
      </a-entity>
    </a-marker>

    <!-- ==================================================================
         МЕТКА 4 (m4) — ЛАБ. «МОДЕЛЬ АТОМА»: двойной тап = подача энергии
         ================================================================== -->
    <a-marker type="pattern" url="markers/m4.patt" id="marker-m4">
      <a-entity class="lab-scene" position="0 0 0" gesture-controls
                lab="title3dRun: ПОГЛОЩЕНА ЭНЕРГИЯ!; title3dReset: ПЛАНЕТАРНАЯ МОДЕЛЬ АТОМА;
                     eqRun: Электроны возбуждены ⚡ переход на внешние орбиты;
                     eqReset: Атом в покое 🌀; sound: false; speedRun: 220">

        <a-entity class="lab-title" ru-text="value: ПЛАНЕТАРНАЯ МОДЕЛЬ АТОМА; color: #7df9ff; height: 0.26" position="0 2.5 0">
          <a-animation attribute="position" dur="3000" direction="alternate" repeat="indefinite" from="0 2.5 0" to="0 2.62 0"></a-animation>
        </a-entity>

        <a-entity position="0 1.0 0">
          <a-entity id="nucleus">
            <a-sphere radius="0.09" position="0.05 0.03 0"    material="color: #ff3b30; metalness: 0.5; roughness: 0.3;"></a-sphere>
            <a-sphere radius="0.09" position="-0.06 -0.02 0.04" material="color: #ff3b30; metalness: 0.5; roughness: 0.3;"></a-sphere>
            <a-sphere radius="0.09" position="0 -0.04 -0.05"  material="color: #3b82f6; metalness: 0.5; roughness: 0.3;"></a-sphere>
            <a-sphere radius="0.09" position="-0.02 0.06 -0.02" material="color: #3b82f6; metalness: 0.5; roughness: 0.3;"></a-sphere>
            <a-animation attribute="rotation" dur="8000" repeat="indefinite" from="0 0 0" to="360 0 360"></a-animation>
          </a-entity>

          <a-torus class="anim-target" radius="0.55" radius-tubular="0.012" rotation="90 0 0"
                   material="color: #7df9ff; metalness: 0.7; roughness: 0.2; emissive: #114455; emissiveIntensity: 0.8;"
                   animation__run="property: material.color; to: #ff5ad9; dur: 600; startEvents: run"
                   animation__reset="property: material.color; to: #7df9ff; dur: 600; startEvents: reset">
          </a-torus>
          <a-entity class="orbit-pivot" orbit-spin="speed: 45">
            <a-sphere class="anim-target" radius="0.06" position="0.55 0 0"
                      material="color: #ffe14d; metalness: 0.6; roughness: 0.2; emissive: #554400; emissiveIntensity: 0.8;"
                      animation__run="property: scale; to: 1.6 1.6 1.6; dur: 600; startEvents: run"
                      animation__reset="property: scale; to: 1 1 1; dur: 600; startEvents: reset">
            </a-sphere>
          </a-entity>

          <a-entity rotation="65 0 20">
            <a-torus class="anim-target" radius="0.72" radius-tubular="0.012" rotation="90 0 0"
                     material="color: #7df9ff; metalness: 0.7; roughness: 0.2; emissive: #114455; emissiveIntensity: 0.8;"
                     animation__run="property: material.color; to: #ff5ad9; dur: 600; startEvents: run"

  <!-- ==================================================================== -->
  <!-- ЛОГИКА ПРИЛОЖЕНИЯ                                                   -->
  <!-- ==================================================================== -->
  <script>
    // ====================================================================
    // КОМПОНЕНТ 0: ru-text — РУССКИЙ ТЕКСТ В 3D.
    // Штатные SDF-шрифты A-Frame содержат только латиницу, поэтому мы
    // рисуем текст на HTML-canvas (кириллица, подстрочные знаки ₂, стрелки
    // →, символы ↑ и ⁺ поддерживаются системным шрифтом) и накладываем
    // canvas как текстуру на плоскость. Это позволяет сделать весь
    // учебник русскоязычным, включая 3D-надписи над сценами.
    // ====================================================================
    AFRAME.registerComponent('ru-text', {
      schema: {
        value:  { default: '' },          // текст; перенос строки — через \n
        color:  { default: '#ffffff' },   // цвет текста
        height: { default: 0.28 }         // высота одной строки в единицах сцены
      },
      init: function () {
        // Холст, на котором будем рисовать текст
        this.canvas = document.createElement('canvas');
        this.ctx = this.canvas.getContext('2d');
        // Текстура из холста + непрозрачный квадрат как геометрия плоскости
        this.texture = new THREE.CanvasTexture(this.canvas);
        var material = new THREE.MeshBasicMaterial({
          map: this.texture, transparent: true, side: THREE.DoubleSide
        });
        this.mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), material);
        this.el.setObject3D('ru-text', this.mesh);
        this.redraw();
      },
      update: function () {               // вызывается при каждой смене атрибутов
        if (this.mesh) this.redraw();     // (например, когда меняется заголовок)
      },
      redraw: function () {
        var lines = (this.data.value || ' ').split('\n');
        var fs = 64, pad = 24;            // кегль рисования и отступ на холсте
        this.ctx.font = 'bold ' + fs + 'px "Segoe UI", Arial, sans-serif';
        var w = 1;
        for (var i = 0; i < lines.length; i++) {   // ищем самую широкую строку
          w = Math.max(w, this.ctx.measureText(lines[i]).width);
        }
        // Меняя размеры холста, мы обнуляем его состояние — шрифт и цвет
        // нужно задать заново ПОСЛЕ изменения размеров
        this.canvas.width = Math.ceil(w + pad * 2);
        this.canvas.height = Math.ceil(fs * 1.3 * lines.length + pad * 2);
        this.ctx.font = 'bold ' + fs + 'px "Segoe UI", Arial, sans-serif';
        this.ctx.fillStyle = this.data.color;
        this.ctx.textAlign = 'center';
        this.ctx.textBaseline = 'middle';
        for (var j = 0; j < lines.length; j++) {
          this.ctx.fillText(lines[j], this.canvas.width / 2,
                            pad + fs * 0.65 + j * fs * 1.3);
        }
        this.texture.needsUpdate = true;  // говорим WebGL: текстура обновилась
        // Масштабируем плоскость: сохраняем пропорции холста
        var worldH = this.data.height * lines.length;
        var worldW = worldH * (this.canvas.width / this.canvas.height);
        this.mesh.scale.set(worldW, worldH, 1);
      }
    });

    // ====================================================================
    // КОМПОНЕНТ 1: orbit-spin — вращение электрона вокруг ядра
    // ====================================================================
    AFRAME.registerComponent('orbit-spin', {
      schema: { speed: { default: 45 } },        // скорость, градусы в секунду
      tick: function (time, dt) {                // dt — миллисекунды с прошлого кадра
        this.el.object3D.rotation.y += this.data.speed * dt / 1000;
      }
    });

    // ====================================================================
    // КОМПОНЕНТ 2: gesture-controls — жесты над активной сценой.
    // Один палец / зажатая мышь — вращение; щипок / колесо — масштаб;
    // двойной тап / двойной клик — событие 'activate' (запуск реакции).
    //
    // ТРИ КЛЮЧЕВЫХ РЕШЕНИЯ ДЛЯ iOS SAFARI:
    // 1. Слушаем document В ФАЗЕ CAPTURE — так наши обработчики выполняются
    //    раньше любых обработчиков A-Frame/AR.js на canvas и не могут быть
    //    проигнорированы.
    // 2. touch-action: none в CSS отключает встроенные жесты Safari
    //    (умный зум двойного тапа, скролл) — иначе Safari забирает жест
    //    себе и шлёт нам touchcancel вместо touchend.
    // 3. Обрабатываем и touchcancel: если Safari всё же отменил касание,
    //    мы просто завершаем перетаскивание, не считая его тапом.
    // ====================================================================
    AFRAME.registerComponent('gesture-controls', {
      init: function () {
        var self = this;
        this.rotX = 0; this.rotY = 0;
        this.zoom = 1;
        this.lastTap = 0;
        this.drag = null;
        this.pinch = 0;

        // --- КАСАНИЯ (смартфон) ---
        document.addEventListener('touchstart', function (e) {
          if (!self.isActive()) return;
          if (e.touches.length === 1) {          // один палец — начало вращения/тапа
            self.drag = { x: e.touches[0].clientX, y: e.touches[0].clientY,
                          moved: 0, t: Date.now() };
          } else if (e.touches.length === 2) {   // два пальца — начало щипка
            self.drag = null;
            self.pinch = self.fingerDistance(e.touches);
          }
        }, { capture: true, passive: true });

        document.addEventListener('touchmove', function (e) {
          if (!self.isActive()) return;
          e.preventDefault();                      // блокируем скролл/зум страницы
          if (e.touches.length === 1 && self.drag) {
            var dx = e.touches[0].clientX - self.drag.x;
            var dy = e.touches[0].clientY - self.drag.y;
            self.drag.x = e.touches[0].clientX;    // перезапоминаем точку (плавно)
            self.drag.y = e.touches[0].clientY;
            self.drag.moved += Math.abs(dx) + Math.abs(dy);
            self.rotY += dx * 0.4;                 // горизонтальный свайп — вокруг оси Y
            self.rotX = Math.max(-60, Math.min(60, self.rotX - dy * 0.4)); // наклон, с ограничением
            self.applyTransform();
          } else if (e.touches.length === 2) {     // щипок: меняем масштаб
            var d = self.fingerDistance(e.touches);
            if (self.pinch > 0) {
              self.zoom = Math.max(0.5, Math.min(2.2, self.zoom * (d / self.pinch)));
              self.applyTransform();
            }
            self.pinch = d;
          }
        }, { capture: true, passive: false });     // passive:false — иначе preventDefault игнорируется

        // Завершение касания: cancelled=true если Safari отменил жест (touchcancel)
        function endTouch(e, cancelled) {
          if (!self.isActive()) { self.drag = null; self.pinch = 0; return; }
          if (e.touches.length === 0 && self.drag) {
            var quick = (Date.now() - self.drag.t) < 500;   // палец поднят быстро
            if (!cancelled && self.drag.moved < 20 && quick) {
              // Палец поднят быстро и почти без движения — это ТАП
              var now = Date.now();
              if (now - self.lastTap < 400) {      // второй тап быстро за первым
                self.lastTap = 0;
                self.el.emit('activate');          // запускаем/сбрасываем реакцию
              } else {
                self.lastTap = now;                // запоминаем первый тап
              }
            }
          }
          if (e.touches.length < 2) self.pinch = 0;
          if (e.touches.length === 0) self.drag = null;
        }
        document.addEventListener('touchend',    function (e) { endTouch(e, false); }, { capture: true, passive: true });
        document.addEventListener('touchcancel', function (e) { endTouch(e, true);  }, { capture: true, passive: true });

        // --- МЫШЬ (ноутбук, демонстрация на защите) ---
        document.addEventListener('mousedown', function (e) {
          if (!self.isActive()) return;
          self.drag = { x: e.clientX, y: e.clientY, moved: 0, t: Date.now() };
        }, { capture: true, passive: true });
        document.addEventListener('mousemove', function (e) {
          if (!self.isActive() || !self.drag) return;
          var dx = e.clientX - self.drag.x, dy = e.clientY - self.drag.y;
          self.drag.x = e.clientX; self.drag.y = e.clientY;
          self.drag.moved += Math.abs(dx) + Math.abs(dy);
          self.rotY += dx * 0.4;
          self.rotX = Math.max(-60, Math.min(60, self.rotX - dy * 0.4));
          self.applyTransform();
        }, { capture: true, passive: true });
        document.addEventListener('mouseup', function () { self.drag = null; }, { capture: true, passive: true });
        document.addEventListener('wheel', function (e) {
          if (!self.isActive()) return;
          self.zoom = Math.max(0.5, Math.min(2.2, self.zoom * (e.deltaY < 0 ? 1.1 : 0.9)));
          self.applyTransform();
        }, { capture: true, passive: true });
        document.addEventListener('dblclick', function () {
          if (self.isActive()) self.el.emit('activate');
        }, { capture: true, passive: true });
      },

      applyTransform: function () {
        this.el.setAttribute('rotation', this.rotX + ' ' + this.rotY + ' 0');
        this.el.setAttribute('scale', this.zoom + ' ' + this.zoom + ' ' + this.zoom);
      },

      isActive: function () { return window.ACTIVE_SCENE === this.el; },

      fingerDistance: function (touches) {
        var dx = touches[0].clientX - touches[1].clientX;
        var dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }
    });

    // ====================================================================
    // КОМПОНЕНТ 3: lab — логика лаборатории
    // ====================================================================
    AFRAME.registerComponent('lab', {
      schema: {
        title3dRun:    { default: '' },
        title3dReset:  { default: '' },
        eqRun:         { default: '' },
        eqReset:       { default: '' },
        sound:         { default: true },
        speedRun:      { default: 0 }
      },
      init: function () {
        this.reacted = false;
        var self = this;
        this.el.addEventListener('activate', function () { self.toggle(); });
        document.querySelector('#equation').textContent = this.data.eqReset || '—';
      },
      toggle: function () {
        this.reacted = !this.reacted;
        var evt = this.reacted ? 'run' : 'reset';
        var targets = this.el.querySelectorAll('.anim-target');
        for (var i = 0; i < targets.length; i++) targets[i].emit(evt);
        if (this.data.speedRun > 0) {          // лаб. «Атом»: меняем скорость электронов
          var pivots = this.el.querySelectorAll('.orbit-pivot');
          var speed = this.reacted ? this.data.speedRun : 45;
          for (var j = 0; j < pivots.length; j++) pivots[j].setAttribute('orbit-spin', 'speed', speed);
        }
        var fast = this.el.querySelector('#bubbles-fast');   // лаб. «Электролиз»
        var idle = this.el.querySelector('#bubbles-idle');
        if (fast) fast.setAttribute('visible', this.reacted);
        if (idle) idle.setAttribute('visible', !this.reacted);
        var title = this.el.querySelector('.lab-title');     // русский 3D-заголовок
        if (title) title.setAttribute('ru-text', 'value', this.reacted ? this.data.title3dRun : this.data.title3dReset);
        document.querySelector('#equation').textContent = this.reacted ? this.data.eqRun : this.data.eqReset;
        // Подтверждение в статусной строке — видно, что двойной тап сработал
        statusEl.textContent = this.reacted ? '⚡ Процесс запущен!' : '↩️ Сцена возвращена в исходное состояние';
        if (this.data.sound) playZap();
      }
    });

    // ====================================================================
    // ЗВУК «РАЗРЯД» (WebAudio API) — без внешних аудиофайлов
    // ====================================================================
    function playZap() {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.3);
      } catch (e) { /* звук заблокирован — продолжаем без него */ }
    }

    // ====================================================================
    // СЛЕЖЕНИЕ ЗА МЕТКАМИ
    // ====================================================================
    var LABS = {
      'marker-info': { title: '⚗️ AR-лаборатории химии', hint: 'Наведите камеру на метки 1–5 — каждая запускает свою лабораторию' },
      'marker-m1':   { title: 'Лаб. 1 · Молекула воды H₂O', hint: 'Крутите: 1 палец · Зум: щипок · 2 тапа: электролиз' },
      'marker-m2':   { title: 'Лаб. 2 · Электролиз', hint: 'Крутите: 1 палец · Зум: щипок · 2 тапа: пустить ток' },
      'marker-m3':   { title: 'Лаб. 3 · Синтез газов', hint: 'Крутите: 1 палец · Зум: щипок · 2 тапа: соединить H₂ + O₂' },
      'marker-m4':   { title: 'Лаб. 4 · Модель атома', hint: 'Крутите: 1 палец · Зум: щипок · 2 тапа: подать энергию' },
      'marker-m5':   { title: 'Лаб. 5 · Кристалл NaCl', hint: 'Крутите: 1 палец · Зум: щипок · 2 тапа: распад на ионы' }
    };
    var statusEl = document.querySelector('#status');
    var titleEl = document.querySelector('#lab-title');
    var hintEl = document.querySelector('#lab-hint');
    var markers = document.querySelectorAll('a-marker');

    for (var k = 0; k < markers.length; k++) {
      (function (marker) {
        var id = marker.id;
        marker.addEventListener('markerFound', function () {
          window.ACTIVE_SCENE = marker.querySelector('.lab-scene');
          var info = LABS[id] || {};
          titleEl.textContent = info.title || '⚗️ AR-лаборатории химии';
          hintEl.textContent = info.hint || '';
          statusEl.textContent = '✅ Метка найдена! Сцена активна';
        });
        marker.addEventListener('markerLost', function () {
          if (window.ACTIVE_SCENE && marker.querySelector('.lab-scene') === window.ACTIVE_SCENE) {
            window.ACTIVE_SCENE = null;
          }
          statusEl.textContent = '🔍 Наведите камеру на метку…';
        });
      })(markers[k]);
    }
  </script>
</body>
